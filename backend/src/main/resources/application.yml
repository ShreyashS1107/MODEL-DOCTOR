server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: model-doctor-backend
  profiles:
    active: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:modeldoctor_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# Management / Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Diagnostic engine downstream service integration config
modeldoctor:
  ml-engine:
    base-url: ${ML_ENGINE_URL:http://localhost:8000}
    timeout-ms: 15000
  storage:
    base-dir: ${STORAGE_BASE_DIR:storage}
    max-model-size-mb: ${MODEL_MAX_SIZE_MB:50}
    max-dataset-size-mb: ${DATASET_MAX_SIZE_MB:100}
    s3-endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket-name: ${S3_BUCKET:model-doctor-artifacts}
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"

# Springdoc OpenAPI Config
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
